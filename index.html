async function fetchWithCloudflare(url, isDownload, signal, request){
  if(!CF.workerUrl) throw new Error('no-worker');
  let endpoint;
  try { endpoint=new URL(CF.workerUrl); } catch(_) { throw new Error('invalid-worker-url'); }
  if(!/^https?:$/.test(endpoint.protocol)) throw new Error('invalid-worker-url');
  endpoint.searchParams.set('url',url);
  const headers={Accept:isDownload?'*/*':'text/html,application/xhtml+xml'};
  if(CF.workerToken) headers['X-WorkBrowser-Token']=CF.workerToken;
  let method='GET', body;
  if(request&&request.method==='POST'){method='POST';body=new URLSearchParams(request.fields||{}).toString();headers['Content-Type']=request.contentType||'application/x-www-form-urlencoded'}
  const res=await fetch(endpoint.toString(),{method,headers,body,signal});
  if(res.status===409||res.headers.get('X-WorkBrowser-Blocked')==='redirect') throw new Error('Redirect blocked before it could leave the page');
  if(!res.ok) throw new Error('Cloudflare Worker '+res.status);
  const ct=(res.headers.get('content-type')||'').toLowerCase();
  if(isDownload || /pdf|octet-stream|video|audio|zip|csv|xlsx|m4a|mp4|webm|mp3/.test(ct) || res.headers.get('content-disposition')){
    return {blob:await res.blob(),contentType:ct,isFile:true};
  }
  const html=await res.text();
  if(!html || html.length<50) throw new Error('Cloudflare Worker returned empty');
  return {html,contentType:ct,isFile:false};
}

async function fetchWithBrowserWorker(url, signal){
  if(!CF.browserWorkerUrl) throw new Error('no-browser-worker');
  let endpoint; try{endpoint=new URL(CF.browserWorkerUrl)}catch(_){throw new Error('invalid-browser-worker-url')}
  endpoint.searchParams.set('url',url);
  const headers={'Accept':'text/html,application/xhtml+xml'};
  if(CF.workerToken) headers['X-WorkBrowser-Token']=CF.workerToken;
  const res=await fetch(endpoint.toString(),{method:'GET',headers,signal});
  if(!res.ok) throw new Error('Browser Worker '+res.status);
  const html=await res.text();
  if(!html || html.length<50) throw new Error('Browser Worker returned empty');
  return {html,contentType:res.headers.get('content-type')||'text/html'};
}

async function fetchWithAnchor(url, isDownload){
  if(!CF.anchorKey) throw new Error('no-key');
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(), 110000);
  try{
    const res=await fetch(ANCHOR_ENDPOINT,{
      method:'POST',
      headers:{'anchor-api-key':CF.anchorKey,'Content-Type':'application/json'},
      body:JSON.stringify({url:url}),
      signal:ctrl.signal
    });
    clearTimeout(to);
    if(!res.ok){
      const txt=await res.text().catch(()=>''+res.status);
      throw new Error('Anchor '+res.status+' '+txt.slice(0,200));
    }
    const ct=(res.headers.get('content-type')||'').toLowerCase();
    // If it's a file download, return blob
    if(isDownload || /pdf|octet-stream|video|audio|zip|csv|xlsx/.test(ct) || res.headers.get('content-disposition')){
      const blob=await res.blob();
      return {blob, contentType:ct, isFile:true};
    }
    const html=await res.text();
    if(!html || html.length<100) throw new Error('Anchor returned empty');
    return {html, contentType:ct, isFile:false};
  } finally { clearTimeout(to); }
}

async function fetchWithFallbacks(url, signal){
  let lastErr=null;
  for(let i=0;i<PROXIES.length;i++){
    try{
      const proxUrl=PROXIES[i](url);
      const r=await fetch(proxUrl,{signal});
      if(!r.ok) throw new Error('Proxy '+i+' HTTP '+r.status);
      const txt=await r.text();
      if(!txt || txt.length<50) throw new Error('Proxy '+i+' empty');
      return txt;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('All proxies failed');
}

function loadTab(t,url,request){
  const id=t.reqId;
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(), 115000);
  const done=(err,d)=>{
    clearTimeout(to);
    if(t.reqId!==id) return;
    t.loading=false;
    if(err){ t.error=err; t.html=null; }
    else { t.html=d.html; t.text=d.text; t.title=d.title||hostOf(url); t.error=null; }
    f();
  };

  (async()=>{
    try{
      // 1. Try the user's Cloudflare Worker first
      if(CF.workerUrl){
        try{
          const c=await fetchWithCloudflare(url,false,ctl.signal,request);
          if(c.isFile){ done(null,{title:'File: '+hostOf(url),text:'File download',html:''}); setTimeout(()=>{let nm='';try{nm=decodeURIComponent(new URL(url).pathname.split('/').pop()||'')}catch(_){}if(!/\.[a-z0-9]{2,5}$/i.test(nm))nm=hostOf(url)+'.bin';triggerBlobDownload(c.blob,nm.replace(/[^\w.\-]+/g,'_').slice(0,90),url);toast('Saved to Downloads in the app')},200); return; }
          const doc=new DOMParser().parseFromString(c.html,'text/html');
          done(null,{title:(doc.title||'').trim()||hostOf(url),text:textOf(c.html),html:rewrite(c.html,url)}); return;
        }catch(e){ console.warn('Cloudflare Worker failed, falling through',e.message); }
      }
      // 2. Try Browser Run Worker for JavaScript-rendered pages
      if(CF.browserWorkerUrl && !(request&&request.method==='POST')){
        try{
          const b=await fetchWithBrowserWorker(url,ctl.signal);
          const doc=new DOMParser().parseFromString(b.html,'text/html');
          done(null,{title:(doc.title||'').trim()||hostOf(url),text:textOf(b.html),html:rewrite(b.html,url)}); return;
        }catch(e){ console.warn('Browser Run Worker failed, falling through',e.message); }
      }
      // 3. Try Anchor if key present
      if(CF.anchorKey && !(request&&request.method==='POST')){
        try{
          const a=await fetchWithAnchor(url,false);
          if(a.isFile){
            // It's a file, not a page — trigger download
            done(null,{title:'File: '+hostOf(url),text:'File download',html:''});
            // trigger download after
            setTimeout(()=>{
              const blobUrl=URL.createObjectURL(a.blob);
              const aEl=document.createElement('a'); aEl.href=blobUrl; aEl.download=hostOf(url)+'.bin'; document.body.appendChild(aEl); aEl.click(); setTimeout(()=>{aEl.remove(); URL.revokeObjectURL(blobUrl)},2000);
              toast('File downloaded via Anchor');
            },200);
            return;
          }
          const doc=new DOMParser().parseFromString(a.html,'text/html');
          done(null,{title:(doc.title||'').trim()||hostOf(url),text:textOf(a.html),html:rewrite(a.html,url)});
          return;
        }catch(e){
          console.warn('Anchor fetch failed, falling back', e.message);
          // fall through to proxies
        }
      }
      // 4. Fallback proxies
      if(request&&request.method==='POST') throw new Error('POST request could not be completed by the Cloudflare Worker');
      const html=await fetchWithFallbacks(url, ctl.signal);
      const doc=new DOMParser().parseFromString(html,'text/html');
      done(null,{title:(doc.title||'').trim()||hostOf(url),text:textOf(html),html:rewrite(html,url)});
    }catch(x){
      if(x&&(x.name==='TypeError'||x.name==='AbortError')){
        S.netBlocked=1;
        done(x.name==='AbortError'?'Page took >110s (Anchor) or 15s (proxy). Try Anchor key or different network.':'Request blocked. If you are in a hosted preview, open the file via https. Or add Anchor API key in Settings.');
      } else {
        done(x.message||String(x));
      }
    }
  })();
}
